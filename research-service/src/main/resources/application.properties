spring.application.name=equilens-research-service

server.port=8080

jwt.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/equilens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
equilens.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
equilens.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
springdoc.swagger-ui.path=/swagger-ui.html
