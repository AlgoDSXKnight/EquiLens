spring.application.name=equilens-portfolio-service

server.port=8081

# Authentication is provided by the application JWT flow, not Boot's generated in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/equilens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

equilens.research-service.url=${RESEARCH_SERVICE_URL:http://localhost:8080}
equilens.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
springdoc.swagger-ui.path=/swagger-ui.html
